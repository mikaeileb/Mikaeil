name: Build TradePilot Android APK
on:
  push:
    branches: [main]
    paths:
      - 'TradePilot-Android-Project-v2.zip'
      - '.github/workflows/build-tradepilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          unzip -o TradePilot-Android-Project-v2.zip -d .
          test -f TradePilot/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies and generate Android project
        working-directory: TradePilot
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: TradePilot/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TradePilot-Android-APK
          path: TradePilot/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
