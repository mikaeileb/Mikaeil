name: Build FocusPro Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'FocusPro/**'
      - '.github/workflows/focuspro-android.yml'
permissions:
  contents: read
  actions: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FocusPro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FocusPro/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: FocusPro/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusPro-Android-APK
          path: FocusPro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30