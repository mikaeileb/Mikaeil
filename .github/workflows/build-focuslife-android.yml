name: Build FocusLife Android APK
on:
  push:
    branches: [main]
    paths:
      - 'focuslife/**'
      - '.github/workflows/build-focuslife-android.yml'
  pull_request:
    paths:
      - 'focuslife/**'
      - '.github/workflows/build-focuslife-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore offline app interface
        run: |
          mkdir -p focuslife/app/src/main/assets
          base64 -d focuslife/index.html.gz.b64 | gzip -dc > focuslife/app/src/main/assets/index.html
      - name: Verify bundled app
        run: test -s focuslife/app/src/main/assets/index.html && grep -q 'FocusLife' focuslife/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: focuslife
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLife-Android-APK
          path: focuslife/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
